<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter with tailwind</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <!-- filtels ni tailwind css -->
    <h1>Hello shivam</h1>

    <h1>blure</h1>
    <img src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="blur-md" src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="blur pt-5" src="https://tinyurl.com/58wu2nvw" alt="image">

    <h1>brigtness</h1>
    <img class="brightness-50" src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="brightness-100" src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="brightness-200" src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="brightness-300" src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="brightness-400" src="https://tinyurl.com/58wu2nvw" alt="image">

    <h1>Cotrast</h1>
    <img class="contrast-50" src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="contrast-100" src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="contrast-200" src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="contrast-300" src="https://tinyurl.com/58wu2nvw" alt="image">
    <img class="contrast-400" src="https://tinyurl.com/58wu2nvw" alt="image">
</body>

</html>
